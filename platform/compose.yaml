services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aisearcharab}
      POSTGRES_USER: ${POSTGRES_USER:-aisearcharab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aisearcharab} -d ${POSTGRES_DB:-aisearcharab}"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build:
      context: ./apps/api
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://aisearcharab:${POSTGRES_PASSWORD}@postgres:5432/aisearcharab}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
      API_PREFIX: ${API_PREFIX:-/v1}
      MAX_SEARCH_LIMIT: ${MAX_SEARCH_LIMIT:-20}
      LOG_SEARCH_QUERIES: ${LOG_SEARCH_QUERIES:-false}
      QUERY_HASH_KEY: ${QUERY_HASH_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && uvicorn aisearcharab_api.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

volumes:
  postgres-data:
