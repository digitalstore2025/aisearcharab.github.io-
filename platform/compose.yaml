x-api-environment: &api-environment
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://aisearcharab:${POSTGRES_PASSWORD}@postgres:5432/aisearcharab}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8000}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,testserver}
  API_PREFIX: ${API_PREFIX:-/v1}
  MAX_SEARCH_LIMIT: ${MAX_SEARCH_LIMIT:-20}
  SEARCH_CANDIDATE_LIMIT: ${SEARCH_CANDIDATE_LIMIT:-300}
  MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-524288}
  LOG_SEARCH_QUERIES: ${LOG_SEARCH_QUERIES:-false}
  QUERY_HASH_KEY: ${QUERY_HASH_KEY:-}
  SESSION_TTL_MINUTES: ${SESSION_TTL_MINUTES:-720}
  SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-30}
  STEP_UP_TTL_MINUTES: ${STEP_UP_TTL_MINUTES:-10}
  LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-5}
  LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
  PASSWORD_MIN_LENGTH: ${PASSWORD_MIN_LENGTH:-14}
  ENFORCE_SEPARATION_OF_DUTIES: ${ENFORCE_SEPARATION_OF_DUTIES:-false}
  REQUIRE_MFA_FOR_PRIVILEGED: ${REQUIRE_MFA_FOR_PRIVILEGED:-false}
  MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:-}
  MFA_ENROLLMENT_TTL_MINUTES: ${MFA_ENROLLMENT_TTL_MINUTES:-10}
  MFA_ISSUER: ${MFA_ISSUER:-AISearcharab.com}

services:
  postgres:
    image: postgres:17.5-alpine@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aisearcharab}
      POSTGRES_USER: ${POSTGRES_USER:-aisearcharab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aisearcharab} -d ${POSTGRES_DB:-aisearcharab}"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  migrate:
    build:
      context: ./apps/api
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    read_only: true
    tmpfs:
      - /tmp
    restart: "no"

  api:
    build:
      context: ./apps/api
    environment: *api-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["uvicorn", "aisearcharab_api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

volumes:
  postgres-data:
