<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0B1F33">
  <meta name="robots" content="noindex,nofollow">
  <title>غير متصل — مرصد الذكاء الاصطناعي العربي</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#0b1f33;background:#f6f8fa}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px}
    main{max-width:640px;background:#fff;border:1px solid #dce3ea;border-radius:20px;padding:32px;box-shadow:0 14px 40px rgba(11,31,51,.08)}
    h1{margin-top:0;font-size:clamp(1.6rem,5vw,2.3rem)}
    p{line-height:1.9;color:#425466}
    a{display:inline-block;margin-top:12px;padding:12px 18px;border-radius:12px;background:#0b1f33;color:#fff;text-decoration:none;font-weight:700}
  </style>
</head>
<body>
  <main>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>يمكنك فتح الصفحات التي سبق تحميلها. أعد المحاولة عند عودة الاتصال للحصول على أحدث البيانات والمصادر.</p>
    <a href="/">العودة إلى الصفحة الرئيسية</a>
  </main>
</body>
</html>
