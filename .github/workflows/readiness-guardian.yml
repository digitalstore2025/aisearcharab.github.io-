name: Validate readiness guardian

on:
  pull_request:
    paths:
      - "engineering/readiness_guardian/**"
      - ".github/workflows/readiness-guardian.yml"
  push:
    branches: [main]
    paths:
      - "engineering/readiness_guardian/**"
      - ".github/workflows/readiness-guardian.yml"

permissions:
  contents: read

jobs:
  readiness-guardian:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: engineering/readiness_guardian
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engineering/readiness_guardian/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install 'pip==26.1.2'
          python -m pip install --require-hashes -r requirements-dev.txt
      - name: Verify installed dependencies
        run: python -m pip check
      - name: Compile
        run: python -m compileall -q app.py readiness scripts tests
      - name: Import UI smoke test
        run: python -c "import app; print('app-import-ok')"
      - name: Unit tests
        run: pytest
      - name: Verify fail-closed seed
        shell: bash
        run: |
          set +e
          python scripts/readiness_gate.py data/snapshot.json
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "Expected the sanitized seed snapshot to remain NO-GO."
            exit 1
          fi
          echo "Fail-closed seed behavior verified."
