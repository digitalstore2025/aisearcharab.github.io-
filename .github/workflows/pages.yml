name: Build and manually deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Compile Python
        run: python -m compileall -q scripts tests

      - name: Scan working tree for obvious secrets
        run: python scripts/scan_sensitive_data.py

      - name: Run tests and data validation
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_data.py
          python scripts/validate_production_integrity.py

      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: "0.147.9"
          extended: true

      - name: Build and validate site
        run: |
          hugo --minify --gc
          python scripts/validate_build.py

      # Manual Pages deployment is production-only. A workflow_dispatch from a
      # feature/PR branch may build for diagnostics but must never upload or deploy.
      # Pages actions are pinned to reviewed immutable release commits.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        with:
          path: public
          # v5 excludes hidden paths by default; preserve .well-known/security.txt.
          include-hidden-files: true

  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy after explicit human dispatch from main only
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
