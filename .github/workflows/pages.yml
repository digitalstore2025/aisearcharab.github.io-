name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Compile Python
        run: python -m compileall -q scripts tests

      - name: Scan working tree for obvious secrets
        run: python scripts/scan_sensitive_data.py

      - name: Run tests and data validation
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_data.py
          python scripts/validate_production_integrity.py

      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: "0.147.9"
          extended: true

      # Ask Pages for the canonical deployment base before building. This keeps
      # relURL output correct on both project Pages paths and future custom domains.
      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
        if: github.ref == 'refs/heads/main'

      - name: Build and validate site
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            test -n "${PAGES_BASE_URL}"
            NORMALIZED_BASE_URL="${PAGES_BASE_URL%/}/"
            hugo --baseURL "${NORMALIZED_BASE_URL}" --minify --gc
          else
            hugo --minify --gc
          fi
          python scripts/validate_build.py

      # Publish only a validated Hugo build from main. Manual runs from feature
      # branches remain diagnostic and cannot upload or deploy production assets.
      - name: Upload validated Hugo artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          path: public
          # v5 excludes hidden paths by default; preserve .well-known/security.txt.
          include-hidden-files: true

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy validated Hugo artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
