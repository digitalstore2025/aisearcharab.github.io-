name: Build and manually deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Compile Python
        run: python -m compileall -q scripts tests

      - name: Scan working tree for obvious secrets
        run: python scripts/scan_sensitive_data.py

      - name: Run tests and data validation
        run: |
          python -m unittest discover -s tests -v
          python scripts/validate_data.py
          python scripts/validate_production_integrity.py

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.147.9"
          extended: true

      - name: Build and validate site
        run: |
          hugo --minify --gc
          python scripts/validate_build.py

      - uses: actions/configure-pages@v5
        if: github.event_name == 'workflow_dispatch'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'workflow_dispatch'
        with:
          path: public

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy after explicit human dispatch
        id: deployment
        uses: actions/deploy-pages@v4
