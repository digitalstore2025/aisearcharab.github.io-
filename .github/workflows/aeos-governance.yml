name: AEOS governance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: aeos-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Compile governance validator
        run: python -m py_compile scripts/validate_aeos_governance.py

      - name: Validate AEOS policy and existing evidence gates
        run: python scripts/validate_aeos_governance.py
