name: Validate site

on:
  workflow_call:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Compile Python
        run: python -m compileall -q scripts tests

      - name: Enforce project identity boundary
        run: python scripts/validate_project_identity.py

      - name: Scan working tree for obvious secrets
        run: python scripts/scan_sensitive_data.py

      - name: Scan reachable Git history for obvious secrets
        run: python scripts/scan_git_history.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate structured data
        run: |
          python scripts/validate_data.py
          python scripts/validate_production_integrity.py

      - uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
        with:
          hugo-version: "0.147.9"
          extended: true

      - name: Build Hugo site
        run: hugo --minify --gc

      - name: Validate generated site
        run: python scripts/validate_build.py

      - name: Enforce static performance budgets
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < public/index.html)" -lt 60000
          test "$(wc -c < public/css/main.css)" -lt 40000
          test "$(wc -c < public/js/search.js)" -lt 12000

      - name: Verify required public assets
        shell: bash
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f public/index.json
          test -f public/robots.txt
          test -f public/sitemap.xml
          test -f public/CNAME
          test -f public/favicon.svg
          test -f public/site.webmanifest
          test -f public/.well-known/security.txt

      - name: Upload validated preview artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-public-site
          path: public
          if-no-files-found: error
          retention-days: 7
