name: Validate site

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile Python
        run: python -m compileall -q scripts tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate structured data
        run: |
          python scripts/validate_data.py
          python scripts/validate_production_integrity.py

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.147.9"
          extended: true

      - name: Build Hugo site
        run: hugo --minify --gc

      - name: Validate generated site
        run: python scripts/validate_build.py

      - name: Enforce static performance budgets
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < public/index.html)" -lt 60000
          test "$(wc -c < public/css/main.css)" -lt 40000
          test "$(wc -c < public/js/search.js)" -lt 12000

      - name: Verify required public assets
        shell: bash
        run: |
          set -euo pipefail
          test -f public/index.html
          test -f public/index.json
          test -f public/robots.txt
          test -f public/sitemap.xml
          test -f public/CNAME
          test -f public/favicon.svg
          test -f public/site.webmanifest
          test -f public/.well-known/security.txt

      - name: Upload validated preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: validated-public-site
          path: public
          if-no-files-found: error
          retention-days: 7
