name: Diagnose platform pytest

on:
  push:
    paths:
      - "platform/**"
      - ".github/workflows/pytest-diagnostics.yml"
  pull_request:
    paths:
      - "platform/**"
      - ".github/workflows/pytest-diagnostics.yml"

permissions:
  contents: read

concurrency:
  group: pytest-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform/apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/apps/api/pyproject.toml
      - name: Install test dependencies
        run: python -m pip install 'pip==26.1.2' && python -m pip install -e '.[dev]'
      - name: Run pytest with JUnit evidence
        run: python -m pytest --junitxml=/tmp/pytest-results.xml
      - name: Upload pytest evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-diagnostics
          path: /tmp/pytest-results.xml
          if-no-files-found: error
          retention-days: 3
