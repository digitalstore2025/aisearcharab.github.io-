name: Verify branch governance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-governance:
    name: branch-governance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Test fail-closed verifier
        run: python3 -m unittest tests.test_branch_governance -v

      - name: Fetch live main branch evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 20 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/branches/main" \
            > /tmp/main-branch.json

      - name: Verify live main protection floor
        run: |
          python3 scripts/verify_branch_governance.py \
            --branch-json /tmp/main-branch.json \
            --output /tmp/branch-governance-evidence.json

      - name: Record governance evidence boundary
        if: always()
        shell: bash
        run: |
          {
            echo "## Branch governance evidence"
            echo
            echo "- Repository: \`${GITHUB_REPOSITORY}\`"
            echo "- Target branch: \`main\`"
            echo "- Source revision under test: \`${GITHUB_SHA}\`"
            echo "- The live check intentionally fails while GitHub reports \`protected=false\`."
            echo "- Passing this minimum floor does **not** by itself mean Production readiness."
            echo "- Full repository-governance closure remains tracked in Issue #97."
          } >> "$GITHUB_STEP_SUMMARY"
