name: Verify branch governance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-governance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  branch-governance:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify main branch is protected
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}/branches/main"
          curl --fail-with-body --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$api" > /tmp/main-branch.json

          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/main-branch.json').read_text(encoding='utf-8'))
          if payload.get('name') != 'main':
              raise SystemExit('branch_governance=fail reason=unexpected_branch_payload')
          protected = payload.get('protected')
          print(f"main_protected={protected}")
          if protected is not True:
              raise SystemExit(
                  'branch_governance=fail reason=main_is_not_protected '
                  'action=enable_branch_protection_or_ruleset'
              )
          print('branch_governance=pass')
          PY

      - name: Record governance evidence
        if: always()
        shell: bash
        run: |
          {
            echo "## Branch governance evidence"
            echo
            echo "- Repository: \`${GITHUB_REPOSITORY}\`"
            echo "- Target branch: \`main\`"
            echo "- This check fails closed while GitHub reports \`protected=false\`."
            echo "- Policy: \`docs/BRANCH_GOVERNANCE.md\`"
          } >> "$GITHUB_STEP_SUMMARY"
