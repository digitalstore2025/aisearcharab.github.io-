name: Platform Web
on:
  pull_request:
    paths:
      - "platform/apps/web/**"
      - "platform/apps/api/src/aisearcharab_api/**"
      - ".github/workflows/platform-web.yml"
      - ".github/workflows/codeql.yml"
      - ".github/dependabot.yml"
  push:
    branches: ["main", "feat/nextjs-web-foundation"]
    paths:
      - "platform/apps/web/**"
      - "platform/apps/api/src/aisearcharab_api/**"
      - ".github/workflows/platform-web.yml"
      - ".github/workflows/codeql.yml"
      - ".github/dependabot.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: platform-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: platform/apps/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
      - name: Verify Node runtime
        run: node -e "const v=process.versions.node; if(!v.startsWith('24.')) throw new Error('Unsupported Node runtime: '+v); console.log('Node runtime',v)"
      - name: Enable Corepack
        run: corepack enable
      - name: Prepare pnpm
        run: corepack prepare pnpm@12.3.4 --activate
      - name: Install reviewed dependency graph
        run: pnpm install --frozen-lockfile
      - name: Audit dependency vulnerabilities
        run: pnpm audit --audit-level moderate
      - name: Python structural and secret audit
        run: python3 scripts/audit_structure.py
      - name: Python design and contrast audit
        run: python3 scripts/audit_design.py
      - name: Python FastAPI contract drift audit
        run: python3 scripts/audit_api_contract.py
      - name: Python release/security gates audit
        run: python3 scripts/audit_release_gates.py
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Production build
        run: pnpm build
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser E2E
        run: pnpm e2e

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript", "python"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          category: "/language:${{ matrix.language }}"
