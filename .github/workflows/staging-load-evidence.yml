name: Staging load SLO evidence

on:
  workflow_dispatch:
    inputs:
      expected_revision:
        description: Full 40-character Git SHA expected to be running on staging
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: staging-load-slo-evidence
  cancel-in-progress: false

jobs:
  bounded-load:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_BASE_URL: https://aisearcharab-api-staging-v2.onrender.com
      EXPECTED_REVISION: ${{ inputs.expected_revision }}
      EVIDENCE_PATH: /tmp/aisearcharab-staging-load-evidence.json
    steps:
      - name: Checkout reviewed code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2

      - name: Set up Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.0.0
        with:
          python-version: '3.12'

      - name: Run bounded read-only staging load probe
        shell: bash
        run: |
          set +e
          PYTHONPATH=platform/apps/api/src \
            python -m aisearcharab_api.staging_load_probe \
              --base-url "$STAGING_BASE_URL" \
              --expected-revision "$EXPECTED_REVISION" \
              --output "$EVIDENCE_PATH"
          code=$?
          echo "LOAD_PROBE_EXIT=$code" >> "$GITHUB_ENV"
          exit 0

      - name: Validate load evidence JSON
        if: always()
        run: python -m json.tool "$EVIDENCE_PATH" > /dev/null

      - name: Upload load evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: staging-load-evidence-${{ inputs.expected_revision }}
          path: /tmp/aisearcharab-staging-load-evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce bounded staging SLO gate
        if: always()
        shell: bash
        run: test "${LOAD_PROBE_EXIT:-1}" = "0"
