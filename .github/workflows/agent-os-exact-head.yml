name: Agent OS exact-head contract

on:
  pull_request:
    paths:
      - "agent-os/**"
      - ".github/workflows/agent-os-exact-head.yml"

permissions:
  contents: read

concurrency:
  group: agent-os-exact-head-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  exact-head-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Compile Agent OS exact head
        run: python -m compileall -q agent-os/src agent-os/scripts agent-os/tests

      - name: Run Agent OS unit tests on exact head
        working-directory: agent-os
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Verify late completion contract on exact head
        working-directory: agent-os
        env:
          PYTHONPATH: src
        run: python scripts/verify_late_completion_contract.py > /tmp/agent-os-exact-head-late-completion.json

      - name: Validate exact-head contract evidence
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/agent-os-exact-head-late-completion.json').read_text())
          assert payload['passed'] is True
          assert payload['success'] is True
          assert payload['safe_stop'] is False
          assert payload['budget_exceeded'] is True
          assert payload['external_outcome'] == 'succeeded'
          assert payload['mutation_count'] == 1
          assert payload['actions'] == []
          assert payload['value_preserved'] is True
          PY

      - name: Upload exact-head contract evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 / Node 24
        with:
          name: agent-os-exact-head-late-completion-${{ github.event.pull_request.head.sha }}
          path: /tmp/agent-os-exact-head-late-completion.json
          if-no-files-found: error
          retention-days: 30
