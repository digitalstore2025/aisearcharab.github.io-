name: Validate platform API

on:
  push:
    paths:
      - "platform/**"
      - "static/js/search.js"
      - "layouts/_default/baseof.html"
      - "hugo.toml"
      - ".github/workflows/platform-api.yml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "platform/**"
      - "static/js/search.js"
      - "layouts/_default/baseof.html"
      - "hugo.toml"
      - ".github/workflows/platform-api.yml"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

concurrency:
  group: platform-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  site-quality:
    uses: ./.github/workflows/ci.yml

  api-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.5-alpine@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
        env:
          POSTGRES_DB: aisearcharab_ci
          POSTGRES_USER: aisearcharab_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aisearcharab_ci -d aisearcharab_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    defaults:
      run:
        working-directory: platform/apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/apps/api/pyproject.toml

      - name: Install API and test dependencies
        run: python -m pip install 'pip==26.1.2' && python -m pip install -e '.[dev]'

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Generate hashed runtime dependency lock
        run: pip-compile pyproject.toml --generate-hashes --strip-extras --output-file /tmp/requirements-runtime.lock

      - name: Upload hashed runtime lock evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase3-1-runtime-lock
          path: /tmp/requirements-runtime.lock
          if-no-files-found: error
          retention-days: 14

      - name: Verify pinned runtime dependency graph
        shell: bash
        run: |
          set -euo pipefail
          expected="$(awk '{print $1}' requirements-runtime.lock.sha256)"
          actual="$(sha256sum /tmp/requirements-runtime.lock | awk '{print $1}')"
          test -n "$expected"
          if [ "$actual" != "$expected" ]; then
            echo "Runtime dependency graph drift detected. Regenerate, audit, review and intentionally update requirements-runtime.lock.sha256." >&2
            echo "expected=$expected" >&2
            echo "actual=$actual" >&2
            exit 1
          fi

      - name: Audit dependencies and generate VEX-aware CycloneDX SBOM
        run: >-
          python scripts/audit_runtime_dependencies.py
          --lock /tmp/requirements-runtime.lock
          --vex security/pip-audit-vex.json
          --report-dir /tmp/dependency-audit
          --cyclonedx-output /tmp/aisearcharab-sbom.cdx.json

      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase3-1-dependency-audit
          path: /tmp/dependency-audit
          if-no-files-found: warn
          retention-days: 14

      - name: Validate runtime CycloneDX SBOM JSON
        run: python -m json.tool /tmp/aisearcharab-sbom.cdx.json > /dev/null

      - name: Upload dependency SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase3-1-dependency-sbom
          path: /tmp/aisearcharab-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Compile Python
        run: python -m compileall -q src tests scripts alembic

      - name: Run API tests
        run: python -m pytest

      - name: Evaluate lexical search
        run: python scripts/evaluate_search.py

      - name: Generate OpenAPI contract
        run: python scripts/export_openapi.py --output ../../contracts/openapi.generated.json

      - name: Validate generated OpenAPI JSON
        run: python -m json.tool ../../contracts/openapi.generated.json > /dev/null

      - name: Upload generated OpenAPI contract
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase3-openapi-contract
          path: platform/contracts/openapi.generated.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify pinned OpenAPI digest
        shell: bash
        run: |
          set -euo pipefail
          expected="$(tr -d '[:space:]' < ../../contracts/openapi.sha256)"
          actual="$(sha256sum ../../contracts/openapi.generated.json | awk '{print $1}')"
          test -n "$expected"
          if [ "$actual" != "$expected" ]; then
            echo "OpenAPI contract drift detected; review and intentionally update platform/contracts/openapi.sha256." >&2
            echo "expected=$expected" >&2
            echo "actual=$actual" >&2
            exit 1
          fi

      - name: Verify migrations, Arabic FTS and MFA concurrency on PostgreSQL
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://aisearcharab_ci:ci-only-password@127.0.0.1:5432/aisearcharab_ci
          ALLOWED_ORIGINS: http://localhost:8000
        run: |
          alembic upgrade head
          alembic current | grep 20260816_0008
          python - <<'PY'
          from sqlalchemy import create_engine, text
          engine = create_engine("postgresql+psycopg://aisearcharab_ci:ci-only-password@127.0.0.1:5432/aisearcharab_ci")
          with engine.connect() as connection:
              assert connection.scalar(text("select version_num from alembic_version")) == "20260816_0008"
              assert connection.scalar(text("select to_regclass('public.ix_content_items_search_fts')")) == "ix_content_items_search_fts"
              assert connection.scalar(text("select to_regclass('public.mfa_recovery_codes')")) == "mfa_recovery_codes"
              assert connection.scalar(text("select to_regclass('public.login_throttles')")) == "login_throttles"
              assert connection.scalar(text("select to_regclass('public.organizations')")) == "organizations"
              assert connection.scalar(text("select to_regclass('public.geo_projects')")) == "geo_projects"
              assert connection.scalar(text("select to_regclass('public.geo_query_sets')")) == "geo_query_sets"
              assert connection.scalar(text("select to_regclass('public.geo_queries')")) == "geo_queries"
              assert connection.scalar(text("select to_regclass('public.geo_provider_runs')")) == "geo_provider_runs"
              assert connection.scalar(text("select to_regclass('public.geo_citations')")) == "geo_citations"
          PY
          python scripts/verify_postgres_search.py
          python scripts/verify_postgres_mfa_concurrency.py

      - name: Verify schema drift with SQLite compatibility path
        env:
          APP_ENV: test
          DATABASE_URL: sqlite+pysqlite:////tmp/aisearcharab-platform-ci.db
          ALLOWED_ORIGINS: http://localhost:8000
        run: |
          rm -f /tmp/aisearcharab-platform-ci.db
          alembic upgrade head
          alembic check

      - name: Validate Docker Compose configuration
        working-directory: platform
        env:
          POSTGRES_PASSWORD: ci-only-password
        run: docker compose config -q

  container-smoke:
    needs: api-quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build API image
        run: docker build --pull=false -t aisearcharab-api:test apps/api

      - name: Smoke API image
        run: |
          docker run --rm --entrypoint python aisearcharab-api:test -c 'from aisearcharab_api.main import app; print(app.title)'

  release-evidence:
    needs: [site-quality, api-quality, container-smoke]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize release gates
        shell: bash
        env:
          SITE_RESULT: ${{ needs.site-quality.result }}
          API_RESULT: ${{ needs.api-quality.result }}
          CONTAINER_RESULT: ${{ needs.container-smoke.result }}
        run: |
          set -euo pipefail
          printf 'site-quality=%s\napi-quality=%s\ncontainer-smoke=%s\n' "$SITE_RESULT" "$API_RESULT" "$CONTAINER_RESULT"
          test "$SITE_RESULT" = success
          test "$API_RESULT" = success
          test "$CONTAINER_RESULT" = success
