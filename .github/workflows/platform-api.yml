name: Validate platform API

on:
  push:
    paths:
      - "platform/**"
      - "static/js/search.js"
      - "layouts/_default/baseof.html"
      - "hugo.toml"
      - ".github/workflows/platform-api.yml"
  pull_request:
    paths:
      - "platform/**"
      - "static/js/search.js"
      - "layouts/_default/baseof.html"
      - "hugo.toml"
      - ".github/workflows/platform-api.yml"

permissions:
  contents: read

concurrency:
  group: platform-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.5-alpine@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
        env:
          POSTGRES_DB: aisearcharab_ci
          POSTGRES_USER: aisearcharab_ci
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aisearcharab_ci -d aisearcharab_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    defaults:
      run:
        working-directory: platform/apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/apps/api/pyproject.toml

      - name: Install API and test dependencies
        run: python -m pip install 'pip==26.1.2' && python -m pip install -e '.[dev]'

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Generate hashed runtime dependency lock
        run: pip-compile pyproject.toml --generate-hashes --strip-extras --output-file /tmp/requirements-runtime.lock

      - name: Upload hashed runtime lock evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase3-1-runtime-lock
          path: /tmp/requirements-runtime.lock
          if-no-files-found: error
          retention-days: 14

      - name: Verify pinned runtime dependency graph
        shell: bash
        run: |
          set -euo pipefail
          expected="$(awk '{print $1}' requirements-runtime.lock.sha256)"
          actual="$(sha256sum /tmp/requirements-runtime.lock | awk '{print $1}')"
          test -n "$expected"
          if [ "$actual" != "$expected" ]; then
            echo "Runtime dependency graph drift detected. Regenerate, audit, review and intentionally update requirements-runtime.lock.sha256." >&2
            echo "expected=$expected" >&2
            echo "actual=$actual" >&2
            exit 1
          fi

      - name: Audit hashed runtime dependencies with dual sources and VEX policy
        run: python scripts/audit_runtime_dependencies.py --lock /tmp/requirements-runtime.lock --vex security/pip-audit-vex.json --report-dir /tmp/dependency-audit

      - name: Upload dependency audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase3-1-dependency-audit
          path: /tmp/dependency-audit
          if-no-files-found: warn
          retention-days: 14

      - name: Generate runtime CycloneDX SBOM
        run: pip-audit -r /tmp/requirements-runtime.lock --require-hashes --strict --progress-spinner off --vulnerability-service osv --format cyclonedx-json --output /tmp/aisearcharab-sbom.cdx.json

      - name: Validate runtime CycloneDX SBOM JSON
        run: python -m json.tool /tmp/aisearcharab-sbom.cdx.json > /dev/null

      - name: Upload dependency SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase3-1-dependency-sbom
          path: /tmp/aisearcharab-sbom.cdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Compile Python
        run: python -m compileall -q src tests scripts alembic

      - name: Run API tests
        run: python -m pytest

      - name: Evaluate lexical search
        run: python scripts/evaluate_search.py

      - name: Generate OpenAPI contract
        run: python scripts/export_openapi.py --output ../../contracts/openapi.generated.json

      - name: Validate generated OpenAPI JSON
        run: python -m json.tool ../../contracts/openapi.generated.json > /dev/null

      - name: Upload generated OpenAPI contract
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase3-openapi-contract
          path: platform/contracts/openapi.generated.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify pinned OpenAPI digest
        shell: bash
        run: |
          set -euo pipefail
          expected="$(tr -d '[:space:]' < ../../contracts/openapi.sha256)"
          actual="$(sha256sum ../../contracts/openapi.generated.json | awk '{print $1}')"
          test -n "$expected"
          test "$actual" = "$expected"

      - name: Verify migrations, Arabic FTS and MFA concurrency on PostgreSQL
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://aisearcharab_ci:ci-only-password@127.0.0.1:5432/aisearcharab_ci
          ALLOWED_ORIGINS: http://localhost:8000
        run: |
          alembic upgrade head
          alembic current | grep 20260808_0005
          python - <<'PY'
          from sqlalchemy import create_engine, text
          engine = create_engine("postgresql+psycopg://aisearcharab_ci:ci-only-password@127.0.0.1:5432/aisearcharab_ci")
          with engine.connect() as connection:
              assert connection.scalar(text("select version_num from alembic_version")) == "20260808_0005"
              assert connection.scalar(text("select to_regclass('public.ix_content_items_search_fts')")) == "ix_content_items_search_fts"
              assert connection.scalar(text("select to_regclass('public.mfa_recovery_codes')")) == "mfa_recovery_codes"
          PY
          python scripts/verify_postgres_search.py
          python scripts/verify_postgres_mfa_concurrency.py

      - name: Verify schema drift with SQLite compatibility path
        env:
          APP_ENV: test
          DATABASE_URL: sqlite+pysqlite:////tmp/aisearcharab-platform-ci.db
          ALLOWED_ORIGINS: http://localhost:8000
        run: |
          rm -f /tmp/aisearcharab-platform-ci.db
          alembic upgrade head
          alembic check

      - name: Validate Docker Compose configuration
        working-directory: platform
        env:
          POSTGRES_PASSWORD: ci-only-password
        run: docker compose config -q

  container-smoke:
    needs: api-quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      POSTGRES_PASSWORD: ci-only-password
      APP_ENV: staging
      ALLOWED_ORIGINS: https://preview.example
      ENFORCE_SEPARATION_OF_DUTIES: "true"
      REQUIRE_MFA_FOR_PRIVILEGED: "true"
      MFA_ENCRYPTION_KEY: "ci-only-not-a-secret-mfa-encryption-key-2026"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build and start hardened stack
        working-directory: platform
        run: |
          docker compose build
          docker compose up -d --wait

      - name: Verify runtime image is non-root, read-only and free of dev tooling
        working-directory: platform
        shell: bash
        run: |
          set -euo pipefail
          uid="$(docker compose exec -T api id -u)"
          test "$uid" != "0"
          docker compose exec -T api sh -c 'if touch /app/.write-probe 2>/dev/null; then echo "runtime root filesystem is unexpectedly writable" >&2; rm -f /app/.write-probe; exit 1; fi'
          docker compose exec -T api python - <<'PY'
          import importlib.util
          for module in ("pytest", "piptools", "pip_audit"):
              assert importlib.util.find_spec(module) is None, f"development/build module leaked into runtime: {module}"
          import aisearcharab_api
          print(f"runtime package={aisearcharab_api.__version__}")
          PY

      - name: Smoke test liveness, migration-aware readiness and capabilities
        run: |
          set -euo pipefail
          curl --retry 8 --retry-connrefused --retry-delay 1 --fail --silent --show-error http://127.0.0.1:8000/health/live
          curl --retry 8 --retry-connrefused --retry-delay 1 --fail --silent --show-error http://127.0.0.1:8000/health/ready
          curl --retry 8 --retry-connrefused --retry-delay 1 --fail --silent --show-error http://127.0.0.1:8000/v1/meta/capabilities

      - name: Capture container logs on failure
        if: failure()
        working-directory: platform
        run: docker compose logs --no-color

      - name: Tear down stack
        if: always()
        working-directory: platform
        run: docker compose down -v --remove-orphans

  release-evidence:
    needs: [api-quality, container-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Prepare immutable release identifiers
        shell: bash
        run: |
          set -euo pipefail
          echo "OPENAPI_SHA256=$(tr -d '[:space:]' < platform/contracts/openapi.sha256)" >> "$GITHUB_ENV"
          echo "DEPENDENCY_LOCK_SHA256=$(awk '{print $1}' platform/apps/api/requirements-runtime.lock.sha256)" >> "$GITHUB_ENV"

      - name: Generate fail-closed release evidence
        env:
          RELEASE_STATUS: INTEGRATED_NOT_TESTED
          RELEASE_MIGRATION: "20260808_0005"
          RELEASE_PR: "13"
          CI_SITE_STATUS: separate-workflow
          CI_API_STATUS: pass
          CI_CONTAINER_STATUS: pass
          DEPENDENCY_AUDIT_PASSED: "true"
          MFA_VERIFIED: "false"
          DISTRIBUTED_RATE_LIMIT_VERIFIED: "false"
          MANAGED_POSTGRES_VERIFIED: "false"
          PITR_VERIFIED: "false"
          BACKUP_VERIFIED: "false"
          RESTORE_VERIFIED: "false"
          WCAG_22_AA_VERIFIED: "false"
          EXTERNAL_SECURITY_REVIEW_VERIFIED: "false"
          EXTERNAL_ACCESSIBILITY_REVIEW_VERIFIED: "false"
          STAGING_VERIFIED: "false"
          DNS_TLS_VERIFIED: "false"
          ROLLBACK_VERIFIED: "false"
          OBSERVABILITY_VERIFIED: "false"
          RELEASE_BLOCKERS: "external staging not verified|distributed rate limiting not verified|managed PostgreSQL and restore drill not verified|external security/accessibility verification pending"
        run: python platform/apps/api/scripts/release_evidence.py --output /tmp/release-evidence.json

      - name: Validate release evidence JSON
        run: python -m json.tool /tmp/release-evidence.json > /dev/null

      - name: Upload release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase3-1-release-evidence
          path: /tmp/release-evidence.json
          if-no-files-found: error
          retention-days: 30
