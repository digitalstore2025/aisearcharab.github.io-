name: Validate platform API

on:
  push:
    paths:
      - "platform/**"
      - ".github/workflows/platform-api.yml"
  pull_request:
    paths:
      - "platform/**"
      - ".github/workflows/platform-api.yml"

permissions:
  contents: read

concurrency:
  group: platform-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform/apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/apps/api/pyproject.toml

      - name: Install API and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Compile Python
        run: python -m compileall -q src tests scripts alembic

      - name: Run API tests
        run: python -m pytest

      - name: Evaluate lexical search
        run: python scripts/evaluate_search.py

      - name: Verify OpenAPI contract is current
        run: |
          cp ../../contracts/openapi.json /tmp/openapi.committed.json
          python scripts/export_openapi.py
          diff -u /tmp/openapi.committed.json ../../contracts/openapi.json

      - name: Verify database migration
        env:
          APP_ENV: test
          DATABASE_URL: sqlite+pysqlite:////tmp/aisearcharab-platform-ci.db
        run: |
          rm -f /tmp/aisearcharab-platform-ci.db
          alembic upgrade head
          alembic current | grep 20260805_0001
          alembic check

      - name: Validate Docker Compose configuration
        working-directory: platform
        env:
          POSTGRES_PASSWORD: ci-only-password
        run: docker compose config -q
