name: Validate platform API

on:
  push:
    paths:
      - "platform/**"
      - "static/js/search.js"
      - "layouts/_default/baseof.html"
      - "hugo.toml"
      - ".github/workflows/platform-api.yml"
  pull_request:
    paths:
      - "platform/**"
      - "static/js/search.js"
      - "layouts/_default/baseof.html"
      - "hugo.toml"
      - ".github/workflows/platform-api.yml"

permissions:
  contents: read

concurrency:
  group: platform-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: platform/apps/api
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: platform/apps/api/pyproject.toml

      - name: Install API and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Compile Python
        run: python -m compileall -q src tests scripts alembic

      - name: Run API tests
        run: python -m pytest

      - name: Evaluate lexical search
        run: python scripts/evaluate_search.py

      - name: Generate OpenAPI contract artifact
        run: python scripts/export_openapi.py

      - name: Validate generated OpenAPI JSON
        run: python -m json.tool ../../contracts/openapi.json > /dev/null

      - name: Upload generated OpenAPI contract
        uses: actions/upload-artifact@v4
        with:
          name: phase3-openapi-contract
          path: platform/contracts/openapi.json
          if-no-files-found: error
          retention-days: 7

      - name: Verify database migration
        env:
          APP_ENV: test
          DATABASE_URL: sqlite+pysqlite:////tmp/aisearcharab-platform-ci.db
        run: |
          rm -f /tmp/aisearcharab-platform-ci.db
          alembic upgrade head
          alembic current | grep 20260805_0002
          alembic check

      - name: Validate Docker Compose configuration
        working-directory: platform
        env:
          POSTGRES_PASSWORD: ci-only-password
        run: docker compose config -q
