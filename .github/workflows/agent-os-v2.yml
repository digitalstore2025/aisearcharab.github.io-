name: Agent OS v2 pilot

on:
  pull_request:
    paths:
      - "agent-os/**"
      - ".github/workflows/agent-os-v2.yml"
  push:
    branches: [main]
    paths:
      - "agent-os/**"
      - ".github/workflows/agent-os-v2.yml"

permissions:
  contents: read

concurrency:
  group: agent-os-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Compile Agent OS
        run: python -m compileall -q agent-os/src agent-os/scripts agent-os/tests

      - name: Run Agent OS unit tests
        working-directory: agent-os
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Run static control-plane evals
        working-directory: agent-os
        env:
          PYTHONPATH: src
        run: python scripts/run_static_evals.py

      - name: Run controlled reliability fault benchmark
        working-directory: agent-os
        env:
          PYTHONPATH: src
        run: >-
          python scripts/run_reliability_benchmark.py
          --out /tmp/agent-os-reliability-benchmark.json
          --repeats 20
          --seed 20260926

      - name: Validate reliability benchmark JSON
        run: python -m json.tool /tmp/agent-os-reliability-benchmark.json > /dev/null

      - name: Upload revision-bound reliability evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1 / Node 24
        with:
          name: agent-os-reliability-${{ github.sha }}
          path: /tmp/agent-os-reliability-benchmark.json
          if-no-files-found: error
          retention-days: 30

      - name: Verify installed CLI package resources
        shell: bash
        run: |
          set -euo pipefail
          python -m pip wheel --no-deps ./agent-os -w /tmp/astra-wheelhouse
          python -m venv /tmp/astra-agent-os-venv
          /tmp/astra-agent-os-venv/bin/pip install --no-index /tmp/astra-wheelhouse/astra_agent_os-*.whl
          (
            cd /tmp
            /tmp/astra-agent-os-venv/bin/agent-os plan "Review auth security before production release" --profile aisearch-study > /tmp/astra-plan.json
            /tmp/astra-agent-os-venv/bin/agent-os team-plan "Complete the AISearch platform end-to-end" --profile aisearch-study --complexity critical --risk high --trace-jsonl /tmp/astra-team-trace.jsonl > /tmp/astra-team.json
            /tmp/astra-agent-os-venv/bin/agent-os team-plan "Audit auth token handling" --profile base --complexity medium --risk medium > /tmp/astra-security-team.json
          )
          /tmp/astra-agent-os-venv/bin/python - <<'PY'
          import json
          from importlib.metadata import version
          from pathlib import Path
          import agent_os

          assert version('astra-agent-os') == agent_os.__version__ == '2.1.0'

          data = json.loads(Path('/tmp/astra-plan.json').read_text())
          assert data['profile'] == 'aisearch-study'
          assert data['mode'] == 'shadow'
          assert data['tier'] == 'strong'
          assert data['production_mutations'] is False
          assert 'repo' in data['allowed_tools']

          team = json.loads(Path('/tmp/astra-team.json').read_text())
          names = [item['agent'] for item in team['assignments']]
          required = [
              'execution-coordinator', 'software-architect', 'product-strategy',
              'ai-rag', 'data-evals', 'research-osint', 'backend-platform',
              'frontend-accessibility', 'seo-geo', 'devops-release',
              'qa-reliability', 'security-redteam', 'independent-reviewer',
          ]
          assert team['portfolio_mode'] is True
          assert names == required
          assert max(map(len, team['waves'])) <= 4
          assert team['waves'][-1] == ['independent-reviewer']
          assert all(item['instructions'].strip() for item in team['assignments'])
          assert all(set(item['allowed_tools']) <= {'repo','public_search','tests','github_pr','ci'} for item in team['assignments'])

          security_team = json.loads(Path('/tmp/astra-security-team.json').read_text())
          security_names = {item['agent'] for item in security_team['assignments']}
          assert security_team['portfolio_mode'] is False
          assert 'security-redteam' in security_names

          trace = json.loads(Path('/tmp/astra-team-trace.jsonl').read_text())
          assert trace['event'] == 'team.plan.created'
          assert trace['data']['agents'] == required
          assert 'Complete the AISearch platform end-to-end' not in Path('/tmp/astra-team-trace.jsonl').read_text()
          PY

      - name: Verify reproducible release archive boundary
        shell: bash
        run: |
          set -euo pipefail
          python agent-os/scripts/build_release.py
          first_hash="$(sha256sum agent-os/dist/astra_agent_os_v2.zip | awk '{print $1}')"
          touch agent-os/src/agent_os/config.py
          python agent-os/scripts/build_release.py
          second_hash="$(sha256sum agent-os/dist/astra_agent_os_v2.zip | awk '{print $1}')"
          test "$first_hash" = "$second_hash"
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive = Path('agent-os/dist/astra_agent_os_v2.zip')
          assert archive.is_file()
          with ZipFile(archive) as zf:
              names = set(zf.namelist())
          assert 'MANIFEST.json' in names
          assert 'config/agents/registry.json' in names
          assert not any(name.startswith('dist/') for name in names)
          assert not any(name.endswith('astra_agent_os_v2.zip') for name in names)
          PY
