name: Bootstrap Web E2E Lock
on:
  push:
    branches: ["feat/nextjs-web-foundation"]
    paths:
      - ".github/workflows/bootstrap-web-e2e-lock.yml"
      - "platform/apps/web/package.json"
permissions:
  contents: write
jobs:
  lock:
    if: github.repository == 'digitalstore2025/aisearcharab.github.io-'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/nextjs-web-foundation
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Generate updated reviewed lock
        working-directory: platform/apps/web
        run: |
          corepack enable
          corepack prepare pnpm@12.3.4 --activate
          pnpm install --no-frozen-lockfile
      - name: Commit lock only
        shell: bash
        run: |
          set -euo pipefail
          test -f platform/apps/web/pnpm-lock.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add platform/apps/web/pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already current"
            exit 0
          fi
          git commit -m "build(web): pin Playwright dependency graph"
          git push origin HEAD:feat/nextjs-web-foundation
