name: Patch runtime lock consumers

on:
  push:
    branches:
      - build/commit-reviewed-runtime-lock-2026-09-05
    paths:
      - ".github/workflows/patch-runtime-lock-consumers.yml"

permissions:
  contents: write

concurrency:
  group: patch-runtime-lock-consumers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Apply fail-closed runtime lock patches
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          test "$(sha256sum platform/apps/api/requirements-runtime.lock | awk '{print $1}')" = "b3200a67a9912364f17a6e5b2a07d780cedc6127f05e4da339791e9780035116"
          grep -Fq 'COPY pyproject.toml README.md requirements-runtime.lock requirements-runtime.lock.sha256 ./' platform/apps/api/Dockerfile
          grep -Fq 'python -m pip wheel --require-hashes --wheel-dir /wheels -r requirements-runtime.lock' platform/apps/api/Dockerfile
          if grep -Fq 'pip-compile pyproject.toml' platform/apps/api/Dockerfile; then
            echo 'Dockerfile still performs mutable runtime resolution' >&2
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {count}")
              return text.replace(old, new, 1)

          platform = Path('.github/workflows/platform-api.yml')
          text = platform.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '          cache-dependency-path: platform/apps/api/pyproject.toml\n',
              '          cache-dependency-path: |\n            platform/apps/api/pyproject.toml\n            platform/apps/api/requirements-runtime.lock\n',
              'platform cache inputs',
          )
          old = '''      - name: Install API and test dependencies
                  run: python -m pip install 'pip==26.1.2' && python -m pip install -e '.[dev]'

                - name: Verify installed dependencies
                  run: python -m pip check

                - name: Generate hashed runtime dependency lock
                  run: pip-compile pyproject.toml --generate-hashes --strip-extras --output-file /tmp/requirements-runtime.lock

                - name: Upload hashed runtime lock evidence
                  uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
                  with:
                    name: phase3-1-runtime-lock
                    path: /tmp/requirements-runtime.lock
                    if-no-files-found: error
                    retention-days: 14

                - name: Verify pinned runtime dependency graph
                  shell: bash
                  run: |
                    set -euo pipefail
                    expected="$(awk '{print $1}' requirements-runtime.lock.sha256)"
                    actual="$(sha256sum /tmp/requirements-runtime.lock | awk '{print $1}')"
                    test -n "$expected"
                    if [ "$actual" != "$expected" ]; then
                      echo "Runtime dependency graph drift detected. Regenerate, audit, review and intentionally update requirements-runtime.lock.sha256." >&2
                      echo "expected=$expected" >&2
                      echo "actual=$actual" >&2
                      exit 1
                    fi
          '''
          # Dedent the embedded literal to match the workflow exactly.
          old = '\n'.join(line[10:] if line.startswith('          ') else line for line in old.splitlines()) + '\n'
          new = '''      - name: Verify reviewed runtime lock integrity
        run: sha256sum -c requirements-runtime.lock.sha256

      - name: Install API and test dependencies
        run: |
          python -m pip install 'pip==26.1.2'
          python -m pip install -e '.[dev]'
          python -m pip install --require-hashes -r requirements-runtime.lock

      - name: Verify installed dependencies
        run: python -m pip check

      - name: Upload reviewed runtime lock evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phase3-1-runtime-lock
          path: platform/apps/api/requirements-runtime.lock
          if-no-files-found: error
          retention-days: 14
'''
          text = replace_once(text, old, new, 'platform runtime lock block')
          text = replace_once(
              text,
              '          --lock /tmp/requirements-runtime.lock\n',
              '          --lock requirements-runtime.lock\n',
              'platform dependency audit lock',
          )
          if 'pip-compile pyproject.toml' in text:
              raise SystemExit('normal Platform API workflow still resolves runtime dependencies with pip-compile')
          platform.write_text(text, encoding='utf-8')

          drift = Path('.github/workflows/dependency-drift-audit.yml')
          text = drift.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '      - "platform/apps/api/requirements-runtime.lock.sha256"\n',
              '      - "platform/apps/api/requirements-runtime.lock"\n      - "platform/apps/api/requirements-runtime.lock.sha256"\n',
              'drift watched lock paths',
          )
          text = replace_once(
              text,
              '  workflow_dispatch:\n',
              '  schedule:\n    - cron: "0 6 * * 1"\n  workflow_dispatch:\n',
              'drift schedule',
          )
          text = replace_once(
              text,
              '      - name: Generate current hashed runtime lock\n',
              '      - name: Verify committed reviewed lock integrity\n        run: sha256sum -c requirements-runtime.lock.sha256\n\n      - name: Generate current hashed runtime lock candidate\n',
              'drift committed lock verification',
          )
          old = '''      - name: Record generated lock digest
        shell: bash
        run: |
          set -euo pipefail
          expected="$(awk '{print $1}' requirements-runtime.lock.sha256)"
          actual="$(sha256sum /tmp/requirements-runtime.lock | awk '{print $1}')"
          printf 'expected=%s\\nactual=%s\\n' "$expected" "$actual" | tee /tmp/runtime-lock-digest.txt
'''
          new = '''      - name: Record reviewed and candidate lock digests
        shell: bash
        run: |
          set -euo pipefail
          reviewed="$(awk '{print $1}' requirements-runtime.lock.sha256)"
          committed="$(sha256sum requirements-runtime.lock | awk '{print $1}')"
          candidate="$(sha256sum /tmp/requirements-runtime.lock | awk '{print $1}')"
          test -n "$reviewed"
          test "$committed" = "$reviewed"
          printf 'reviewed=%s\\ncommitted=%s\\ncandidate=%s\\n' "$reviewed" "$committed" "$candidate" | tee /tmp/runtime-lock-digest.txt
'''
          text = replace_once(text, old, new, 'drift digest evidence')
          text = replace_once(
              text,
              '          name: dependency-drift-review\n',
              '          name: dependency-drift-review-${{ github.sha }}\n',
              'drift artifact revision binding',
          )
          text = replace_once(
              text,
              '          path: |\n            /tmp/requirements-runtime.lock\n',
              '          path: |\n            platform/apps/api/requirements-runtime.lock\n            /tmp/requirements-runtime.lock\n',
              'drift artifact reviewed lock',
          )
          drift.write_text(text, encoding='utf-8')

          docs = Path('docs/RUNTIME_DEPENDENCY_LOCK.md')
          docs.write_text('''# Runtime dependency lock policy

## Authority

`platform/apps/api/pyproject.toml` declares the API's direct dependency constraints. The reviewed production install authority is `platform/apps/api/requirements-runtime.lock`; `requirements-runtime.lock.sha256` is its integrity and release identifier.

Normal CI and production container builds must not resolve the runtime dependency graph from the mutable package index. They verify the committed lock digest and install/build dependencies from the exact pinned versions and hashes in that lock.

## Release path

The production Docker build copies both the lock and checksum, verifies them with `sha256sum -c`, and builds dependency wheels with `pip --require-hashes`. The application wheel is built separately with pinned build tooling and `--no-build-isolation`. Runtime installation is from the locally built wheel directory with `--no-index`.

The Platform API gate audits the committed reviewed lock, generates its VEX-aware dependency evidence and CycloneDX SBOM, and uploads the committed lock as revision evidence. It does not run `pip-compile` in the normal release path.

## Refresh path

`.github/workflows/dependency-drift-audit.yml` is the only routine path that resolves a new candidate runtime graph from the mutable package index. It runs on demand, weekly, and for dependency-policy pull requests. The workflow:

1. verifies that the currently committed lock matches its reviewed checksum;
2. generates a candidate hashed lock with the pinned `pip-compile` toolchain;
3. records the reviewed, committed, and candidate digests;
4. performs the VEX-aware PyPI/OSV dependency audit;
5. generates and validates a CycloneDX SBOM;
6. publishes the reviewed lock, candidate lock, digest comparison, audit evidence, and SBOM as a revision-bound artifact.

A candidate artifact is evidence for review only. It never updates the production lock automatically.

## Promotion

To promote a candidate, review the dependency diff and audit/SBOM evidence, then commit the candidate as `requirements-runtime.lock` and update `requirements-runtime.lock.sha256` in the same pull request. The exact final pull-request head must pass the API, migration, container, security, and release-evidence gates before merge.

## Rollback

Rollback is a source-control operation: revert the lock and checksum together to a previously audited revision, then run the same release gates. Do not regenerate dependencies during rollback.

## Security boundary

This design prevents silent transitive-version drift between review and build. It does not make the build fully hermetic or guarantee package-index availability: exact artifacts are still fetched during the builder stage unless they are vendored or served from a controlled immutable mirror. Hash pinning also does not replace vulnerability review, provenance review, VEX handling, SBOM generation, or application tests.
''', encoding='utf-8')
          PY

      - name: Commit patched files through the GitHub contents API
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"

          put_existing() {
            local path="$1"
            local message="$2"
            local sha
            sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=${GITHUB_REF_NAME}" --jq .sha)"
            PATH_TO_WRITE="$path" CURRENT_SHA="$sha" COMMIT_MESSAGE="$message" python - <<'PY'
          import base64, json, os
          from pathlib import Path
          path = os.environ['PATH_TO_WRITE']
          payload = {
              'message': os.environ['COMMIT_MESSAGE'],
              'content': base64.b64encode(Path(path).read_bytes()).decode('ascii'),
              'sha': os.environ['CURRENT_SHA'],
              'branch': os.environ['GITHUB_REF_NAME'],
          }
          Path('/tmp/github-update.json').write_text(json.dumps(payload), encoding='utf-8')
          PY
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" --input /tmp/github-update.json >/dev/null
          }

          put_new() {
            local path="$1"
            local message="$2"
            PATH_TO_WRITE="$path" COMMIT_MESSAGE="$message" python - <<'PY'
          import base64, json, os
          from pathlib import Path
          path = os.environ['PATH_TO_WRITE']
          payload = {
              'message': os.environ['COMMIT_MESSAGE'],
              'content': base64.b64encode(Path(path).read_bytes()).decode('ascii'),
              'branch': os.environ['GITHUB_REF_NAME'],
          }
          Path('/tmp/github-create.json').write_text(json.dumps(payload), encoding='utf-8')
          PY
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" --input /tmp/github-create.json >/dev/null
          }

          put_existing ".github/workflows/platform-api.yml" "ci: consume reviewed runtime lock in release gates"
          put_existing ".github/workflows/dependency-drift-audit.yml" "ci: isolate mutable dependency resolution to drift audit"
          put_new "docs/RUNTIME_DEPENDENCY_LOCK.md" "docs: define runtime lock refresh and rollback policy"
