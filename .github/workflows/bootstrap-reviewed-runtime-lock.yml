name: Bootstrap reviewed runtime lock

on:
  push:
    branches:
      - build/commit-reviewed-runtime-lock-2026-09-05
    paths:
      - ".github/workflows/bootstrap-reviewed-runtime-lock.yml"

permissions:
  contents: write

concurrency:
  group: bootstrap-reviewed-runtime-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-reviewed-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Restore previously audited runtime lock and commit it to this branch
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEWED_ARTIFACT_ID: "9962837236"
          REVIEWED_LOCK_SHA256: "b3200a67a9912364f17a6e5b2a07d780cedc6127f05e4da339791e9780035116"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/reviewed-lock
          curl --fail --location --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${REVIEWED_ARTIFACT_ID}/zip" \
            --output /tmp/reviewed-lock.zip
          unzip -q /tmp/reviewed-lock.zip -d /tmp/reviewed-lock
          test -s /tmp/reviewed-lock/requirements-runtime.lock
          actual="$(sha256sum /tmp/reviewed-lock/requirements-runtime.lock | awk '{print $1}')"
          test "$actual" = "$REVIEWED_LOCK_SHA256"

          python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path

          lock = Path('/tmp/reviewed-lock/requirements-runtime.lock').read_bytes()
          payload = {
              'message': 'build: commit previously audited runtime lock',
              'content': base64.b64encode(lock).decode('ascii'),
              'branch': os.environ['GITHUB_REF_NAME'],
          }
          Path('/tmp/create-lock.json').write_text(json.dumps(payload), encoding='utf-8')
          PY

          gh api \
            --method PUT \
            "repos/${GITHUB_REPOSITORY}/contents/platform/apps/api/requirements-runtime.lock" \
            --input /tmp/create-lock.json >/tmp/create-lock-response.json
          python -m json.tool /tmp/create-lock-response.json >/dev/null
